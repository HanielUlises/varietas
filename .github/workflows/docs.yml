name: docs

# Build the Sphinx site and publish it to GitHub Pages.
#
# The build runs on every push so a broken document is a failed check rather
# than a broken page; only main is deployed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push wait rather than cancel: a
# half-finished deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx and the theme
        run: python -m pip install -r docs/requirements.txt

      # -W turns warnings into errors: a dead cross-reference or a malformed
      # table fails here rather than shipping. --keep-going reports all of them
      # in one run instead of one per push.
      - name: Build
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
